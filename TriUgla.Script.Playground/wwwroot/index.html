<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Keep framework and static assets relative to the deployment directory. -->
    <base href="./" />
    <link rel="stylesheet" href="css/app.css" />
    <style>
        /* This remains available when the main stylesheet or WASM runtime cannot load. */
        html, body, #app { width: 100%; min-height: 100%; }
        body { margin: 0; background: #09101d; color: #f3f6fb; font-family: system-ui, sans-serif; }
        .loading, .startup-error { min-height: 100vh; display: grid; place-content: center; gap: 12px; padding: 32px; text-align: center; }
        .startup-error h1, .startup-error p { margin: 0; }
        .startup-error p { max-width: 680px; color: #fecdd3; }
        .startup-error button { justify-self: center; padding: 8px 12px; border: 1px solid #64748b; border-radius: 7px; background: #17243a; color: inherit; }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">Loading playground…</div>
    </div>
    <div id="blazor-error-ui">
        An unexpected error occurred. <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss">×</button>
    </div>
    <script>
        const showStartupError = message => {
            const host = document.getElementById("app");
            if (!host || !host.querySelector(".loading")) return;
            host.innerHTML = `<main class="startup-error" role="alert"><h1>TriUgla could not start</h1><p></p><button type="button" onclick="location.reload()">Reload application</button></main>`;
            host.querySelector("p").textContent = message;
        };
        window.addEventListener("error", event => {
            const failedResource = event.target?.src || event.target?.href;
            showStartupError(failedResource
                ? `A required application resource could not be loaded: ${failedResource}`
                : event.message || "The browser could not initialize the application.");
        }, true);
        window.addEventListener("unhandledrejection", event => {
            const reason = event.reason;
            showStartupError((reason && reason.message) || String(reason || "The application failed during startup."));
        });
    </script>
    <script src="js/editor.js"></script>
    <script src="js/mesh-viewer.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
