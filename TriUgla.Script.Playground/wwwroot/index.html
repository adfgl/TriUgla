<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">
        <div class="loading">Loading playground…</div>
    </div>
    <div id="blazor-error-ui">
        An unexpected error occurred. <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss">×</button>
    </div>
    <script>
        window.addEventListener("error", event => {
            const host = document.getElementById("app");
            if (!host || host.children.length > 1 || !host.querySelector(".loading")) return;
            host.innerHTML = `<main class="startup-error" role="alert"><h1>TriUgla could not start</h1><p></p><button type="button" onclick="location.reload()">Reload application</button></main>`;
            host.querySelector("p").textContent = event.message || "The browser could not initialize the application.";
        });
        window.addEventListener("unhandledrejection", event => {
            const host = document.getElementById("app");
            if (!host || !host.querySelector(".loading")) return;
            host.innerHTML = `<main class="startup-error" role="alert"><h1>TriUgla could not start</h1><p></p><button type="button" onclick="location.reload()">Reload application</button></main>`;
            const reason = event.reason;
            host.querySelector("p").textContent = (reason && reason.message) || String(reason || "The application failed during startup.");
        });
    </script>
    <script src="js/editor.js"></script>
    <script src="js/mesh-viewer.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
